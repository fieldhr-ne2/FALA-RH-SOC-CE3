<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ee4d2d">
<title>FALA RH | SOC-CE3</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--orange:#ee4d2d;--orange2:#ff704d;--ink:#202124;--muted:#73777f;--line:#eceef1;--bg:#f5f6f8;--white:#fff;--green:#16845b;--red:#c93636;--shadow:0 8px 28px rgba(20,25,35,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-weight:850;letter-spacing:.2px;color:var(--orange);font-size:22px}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#fff 30%,#fff1ed)}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{margin:5px 0 4px;font-size:25px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:650;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe2e7;border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ee4d2d18}.field textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;background:#f0f1f3;color:#34363a}.btn.primary{background:var(--orange);color:#fff}.btn.primary:hover{background:#d94325}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}.full{width:100%}.linkbtn{border:0;background:none;color:var(--orange);font-weight:700;padding:8px 0}.app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.top-left{display:flex;align-items:center;gap:14px}.top-right{display:flex;align-items:center;gap:12px}.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}.nav-label{font-size:10px;color:#9a9da4;font-weight:800;letter-spacing:1px;padding:14px 12px 7px}.nav{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#50535a;font-weight:650;margin:2px 0}.nav:hover,.nav.active{background:#fff0ec;color:var(--orange)}.nav .ico{width:20px;text-align:center}.main{padding:26px;width:100%;max-width:1500px;margin:0 auto}.welcome{margin-bottom:22px}.welcome h1{font-size:25px;margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 12px rgba(20,25,35,.025)}.stat .num{font-size:27px;font-weight:850;margin-top:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}.section-head h2{margin:0;font-size:20px}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-flex;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:800;background:#f0f1f3;color:#565b63}.pill.green{background:#e8f6ef;color:#14734e}.pill.orange{background:#fff0ec;color:#d84a2b}.pill.red{background:#fff0f0;color:#b82d2d}.ticket{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.ticket summary{list-style:none;padding:15px 17px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;font-weight:750}.ticket summary::-webkit-details-marker{display:none}.ticket summary:after{content:"⌄";font-size:18px;color:var(--muted)}.ticket[open] summary:after{content:"⌃"}.ticket-body{border-top:1px solid var(--line);padding:16px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#777;background:#fafafa}tr:last-child td{border-bottom:0}.notice{padding:13px 15px;border-radius:11px;background:#fff5e9;color:#81501a;margin:12px 0}.success{background:#eaf7f0;color:#176b49}.error{background:#fff0f0;color:#a92d2d}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-weight:700}.tab.active{border-color:var(--orange);color:var(--orange);background:#fff5f2}.modal-back{position:fixed;inset:0;background:#10131888;z-index:30;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:16px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}.modal h2{margin:0 0 12px}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#24272c;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow)}.mobile-menu{display:none}.pdfbox{height:70vh;overflow:auto;background:#555;border-radius:12px;padding:12px;text-align:center}.pdfbox canvas{max-width:100%;height:auto;margin:0 auto 12px;display:block}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9dce1;border-radius:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted-line{border:0;border-top:1px solid var(--line);margin:17px 0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:215px}.main{padding:20px}}
@media(max-width:680px){.topbar{padding:0 15px}.mobile-menu{display:inline-flex}.sidebar{position:fixed;z-index:20;top:68px;bottom:0;left:0;transform:translateX(-105%);transition:.2s;width:270px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{padding:17px 13px 90px}.grid{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat .num{font-size:22px}.welcome h1{font-size:22px}.top-right .user-email{display:none}.two{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.auth-card{padding:23px}}
</style>
</head>
<body>
<div id="auth" class="auth-wrap">
 <div class="auth-card">
  <div class="brand">[RH] FALA RH</div><h1 id="authTitle">Acesse sua conta</h1><p class="muted">Comunicação e atendimento de RH · SOC-CE3</p>
  <div id="authMsg"></div>
  <form id="loginForm">
   <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div>
   <div class="field"><label>Senha</label><div class="row"><input id="loginPassword" type="password" autocomplete="current-password" required style="flex:1"><button type="button" class="btn ghost" onclick="togglePassword('loginPassword',this)">◉</button></div></div>
   <button class="btn primary full" id="loginBtn">Entrar</button>
  </form>
  <form id="registerForm" class="hidden">
   <div class="field"><label>Nome completo</label><input id="regName" required></div>
   <div class="field"><label>E-mail pessoal</label><input id="regEmail" type="email" required></div>
   <div class="field"><label>WhatsApp</label><input id="regPhone" required></div>
   <div class="field"><label>Turno</label><select id="regShift" required><option value="">Selecione</option><option>T1</option><option>T2</option><option>T3</option><option>T4</option></select></div>
   <div class="field"><label>Senha</label><div class="row"><input id="regPassword" type="password" minlength="6" required style="flex:1"><button type="button" class="btn ghost" onclick="togglePassword('regPassword',this)">◉</button></div></div>
   <button class="btn primary full" id="registerBtn">Criar cadastro</button>
  </form>
  <button class="linkbtn" id="authSwitch">Ainda não tenho cadastro</button>
  <p class="small muted">O acesso é individual. Não compartilhe sua senha.</p>
 </div>
</div>
<div id="app" class="app hidden">
 <header class="topbar"><div class="top-left"><button class="btn ghost mobile-menu" onclick="toggleMenu()">☰</button><div class="brand">[RH] FALA RH</div></div><div class="top-right"><button class="btn ghost" onclick="profile()">Meu perfil</button><span class="user-email small muted" id="userLabel"></span><button class="btn ghost" onclick="logout()">Sair</button></div></header>
 <div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);
let SESSION=null, PROFILE=null, CURRENT='home', CACHE={}, BUSY=false;
const ADMIN=['PRINCIPAL','ASSISTENTE'];
function togglePassword(id,btn){const e=$(id);e.type=e.type==='password'?'text':'password';btn.textContent=e.type==='password'?'◉':'◎'}
function toggleMenu(){$('sidebar').classList.toggle('open')}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function api(action,data={}){
  return new Promise((resolve,reject)=>{
    if(!google?.script?.run) return reject(new Error('Abra este aplicativo pela URL publicada do Apps Script.'));
    const runner=google.script.run
      .withSuccessHandler(r=>{if(r&&r.ok===false)reject(new Error(r.error||'Falha na operação'));else resolve(r)})
      .withFailureHandler(e=>reject(new Error(e.message||String(e))));
    if(action==='login'||action==='register'){
      runner[action](data);
    }else if(action==='resumeSession'||action==='logout'){
      runner[action](SESSION);
    }else if(action==='api'){
      runner.api(SESSION,data);
    }else{
      reject(new Error('Operação de comunicação inválida: '+action));
    }
  });
}
function call(action,data={}){return api('api',[action,data])}
async function submitAuth(action,data,btn){if(BUSY)return;BUSY=true;btn.disabled=true;try{const r=await api(action,data);if(action==='login'){SESSION=r.token;PROFILE=r.profile;localStorage.setItem('falaSession',SESSION);showApp();if(PROFILE.mustChangePassword)passwordModal(true)}else{$('authMsg').innerHTML='<div class="notice success">Cadastro realizado. Faça login para continuar.</div>';$('registerForm').classList.add('hidden');$('loginForm').classList.remove('hidden');$('authSwitch').textContent='Ainda não tenho cadastro'} }catch(e){$('authMsg').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}finally{BUSY=false;btn.disabled=false}}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();submitAuth('login',{email:$('loginEmail').value,password:$('loginPassword').value},$('loginBtn'))});
$('registerForm').addEventListener('submit',e=>{e.preventDefault();submitAuth('register',{name:$('regName').value,email:$('regEmail').value,phone:$('regPhone').value,shift:$('regShift').value,password:$('regPassword').value},$('registerBtn'))});
$('authSwitch').onclick=()=>{const reg=$('registerForm').classList.toggle('hidden');$('loginForm').classList.toggle('hidden');$('authTitle').textContent=reg?'Crie seu cadastro':'Acesse sua conta';$('authSwitch').textContent=reg?'Já tenho cadastro':'Ainda não tenho cadastro';$('authMsg').innerHTML=''};
function showAuth(){$('auth').classList.remove('hidden');$('app').classList.add('hidden')}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=PROFILE.name+' · '+PROFILE.role;buildNav();navigate(ADMIN.includes(PROFILE.role)?'adminHome':'home')}
async function logout(){try{await call('logout')}catch(e){}SESSION=null;PROFILE=null;localStorage.removeItem('falaSession');showAuth()}
const employeeNav=[['home','⌂','Início'],['announcements','▤','Comunicados'],['newTicket','＋','Abrir chamado'],['myTickets','▣','Meus chamados'],['library','▧','Biblioteca RH'],['faq','?','FAQ'],['reports','⚑','Reports']];
const adminNav=[['adminHome','⌂','Painel RH'],['adminTickets','▣','Gestão de chamados'],['internalTickets','◫','Tickets'],['adminAnnouncements','▤','Comunicados'],['adminLibrary','▧','Biblioteca RH'],['adminFaq','?','FAQ'],['reports','⚑','Reports'],['analytics','▥','Relatórios'],['users','♙','Colaboradores'],['admins','♜','Gerenciar acessos'],['audit','≡','Auditoria']];
function buildNav(){
  let items;
  if(ADMIN.includes(PROFILE.role)){
    items=adminNav.filter(i=>{
      if(i[0]==='admins'&&PROFILE.role!=='PRINCIPAL')return false;
      if(i[0]==='reports'&&PROFILE.role!=='PRINCIPAL'&&!PROFILE.reportsAccess)return false;
      return true;
    });
  }else{
    items=employeeNav;
  }
  $('sidebar').innerHTML='<div class="nav-label">'+(ADMIN.includes(PROFILE.role)?'ÁREA ADMINISTRATIVA':'ÁREA DO COLABORADOR')+'</div>'+items.map(([id,ico,n])=>`<button class="nav" data-page="${id}" onclick="navigate('${id}')"><span class="ico">${ico}</span>${n}</button>`).join('')+'<div class="nav-label">UNIDADE</div><div class="small muted" style="padding:8px 12px">SOC-CE3</div>';
}
async function navigate(page){CURRENT=page;$('sidebar').classList.remove('open');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('main').innerHTML='<div class="empty">Carregando...</div>';try{const fn=pages[page];if(!fn)throw Error('Área não encontrada');await fn()}catch(e){$('main').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function head(title,desc='',right=''){return `<div class="section-head"><div><h2>${title}</h2><div class="muted small">${desc}</div></div>${right}</div>`}
function stat(label,value,sub=''){return `<div class="stat"><div class="muted small">${label}</div><div class="num">${value??0}</div><div class="muted small">${sub}</div></div>`}
function empty(s){return `<div class="empty">${s}</div>`}
function formField(label,id,type='text',value='',opts=null){let input=opts?`<select id="${id}" required><option value="">Selecione</option>${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="${id}" required>${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}" required>`;return `<div class="field"><label>${label}</label>${input}</div>`}
function modal(title,body,footer=''){ $('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="between"><h2>${title}</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>${body}${footer}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
async function home(){const d=await call('dashboard');$('main').innerHTML=`<div class="welcome"><h1>Olá, ${esc(PROFILE.name.split(' ')[0])}!</h1><div class="muted">Acompanhe comunicados, abra chamados e conecte-se com o RH.</div></div><div class="grid">${stat('Comunicados pendentes',d.pendingReads)}${stat('Meus chamados',d.myTickets)}${stat('Notificações',d.notifications)}${stat('Turno atual',esc(PROFILE.shift||'—'),'SOC-CE3')}</div><div style="height:18px"></div>${d.pendingReads?`<div class="notice">Você possui comunicado(s) obrigatório(s) pendente(s). Confirme a leitura antes de abrir um chamado.</div>`:''}<div class="card"><h3>Acesso rápido</h3><div class="actions"><button class="btn primary" onclick="navigate('announcements')">Ver comunicados</button><button class="btn" onclick="navigate('newTicket')">Abrir chamado</button><button class="btn" onclick="navigate('myTickets')">Meus chamados</button></div></div>`}
async function adminHome(){const d=await call('analytics');$('main').innerHTML=`<div class="welcome"><h1>Painel administrativo do RH</h1><div class="muted">Visão geral da operação · SOC-CE3</div></div><div class="grid">${stat('Total de chamados',d.totalTickets)}${stat('Dentro do prazo',d.onTime)}${stat('SLA vencido',d.overdue)}${stat('Leituras confirmadas',d.reads)}</div><div class="card" style="margin-top:16px"><h3>Acessos rápidos do RH</h3><div class="actions"><button class="btn primary" onclick="navigate('adminTickets')">Gestão de chamados</button><button class="btn" onclick="navigate('adminAnnouncements')">Comunicados</button><button class="btn" onclick="navigate('analytics')">Relatórios</button><button class="btn" onclick="navigate('users')">Colaboradores</button></div></div>`}

async function announcements(){const d=await call('listAnnouncements');CACHE.announcements=d.items;$('main').innerHTML=head('Comunicados do RH','Comunicados oficiais e confirmação de ciência')+`<div class="stack">${d.items.length?d.items.map(a=>`<article class="card"><div class="between"><span class="pill orange">COMUNICADO OFICIAL DO RH</span><span class="small muted">${esc(a.date)} ${esc(a.time)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.body).replace(/\n/g,'<br>')}</p><div class="between"><span class="small muted">Publicado por ${esc(a.publisher)}</span>${a.read?'<span class="pill green">LIDO</span>':`<button class="btn primary" onclick="markRead('${a.id}')">Marcar como lido</button>`}</div>${a.read?`<div class="small muted">Lido em ${esc(a.readAt||'')}</div>`:''}</article>`).join(''):empty('Nenhum comunicado publicado.')}</div>`}
async function markRead(id){await call('markAnnouncementRead',{id});toast('Leitura confirmada');announcements()}
async function newTicket(){const d=await call('ticketPrerequisites');if(d.pendingReads){$('main').innerHTML=head('Abrir chamado')+`<div class="notice">Você precisa confirmar a leitura de todos os comunicados obrigatórios antes de abrir um chamado.</div><button class="btn primary" onclick="navigate('announcements')">Ir para comunicados</button>`;return}$('main').innerHTML=head('Abrir chamado','Descreva sua solicitação para o RH')+`<div class="card"><form id="ticketForm" class="two">${formField('Nome','tName','text',PROFILE.name)}${formField('E-mail','tEmail','email',PROFILE.email)}${formField('WhatsApp','tPhone','text',PROFILE.phone||'')}${formField('Turno','tShift','text',PROFILE.shift)}${formField('Categoria','tCategory','text','',d.categories)}<div class="field"><label>Descrição</label><textarea id="tDescription" required></textarea></div><div class="field"><label>Unidade</label><input value="SOC-CE3" disabled></div><div><button class="btn primary" id="ticketSubmit">Enviar chamado</button></div></form></div>`;$('ticketForm').onsubmit=async e=>{e.preventDefault();const b=$('ticketSubmit');if(b.disabled)return;b.disabled=true;try{const r=await call('createTicket',{category:$('tCategory').value,description:$('tDescription').value,phone:$('tPhone').value,shift:$('tShift').value});toast('Chamado '+r.number+' aberto com sucesso!');navigate('myTickets')}catch(err){toast(err.message);b.disabled=false}}}
function ticketCard(t,admin=false){return `<details class="ticket"><summary><span>${esc(t.number)} · ${esc(t.category)}</span><span class="pill ${t.status==='CONCLUÍDO'?'green':t.status==='REJEITADO'?'red':'orange'}">${esc(t.status)}</span></summary><div class="ticket-body"><div class="two"><div><span class="muted small">Aberto em</span><div>${esc(t.createdAt)}</div></div><div><span class="muted small">Turno</span><div>${esc(t.shift)}</div></div><div><span class="muted small">SLA previsto</span><div>${esc(t.dueAt||'—')}</div></div><div><span class="muted small">Categoria</span><div>${esc(t.category)}</div></div></div><hr class="muted-line"><p>${esc(t.description)}</p>${t.observation?`<div class="notice">${esc(t.observation)}</div>`:''}<h4>Histórico</h4>${(t.history||[]).map(h=>`<p class="small"><b>${esc(h.status)}</b> · ${esc(h.date)} · ${esc(h.actor)} ${esc(h.note||'')}</p>`).join('')}${admin?`<div class="actions"><button class="btn" onclick="adminTicketAction('${t.id}','AGUARDANDO RETORNO DO CORPORATIVO')">Aguardar corporativo</button><button class="btn" onclick="adminTicketAction('${t.id}','CONCLUÍDO')">Concluir</button><button class="btn danger" onclick="adminTicketAction('${t.id}','REJEITADO')">Rejeitar</button><button class="btn" onclick="extendTicket('${t.id}')">Estender SLA</button></div>`:t.status==='ABERTO'?`<button class="btn danger" onclick="cancelTicket('${t.id}')">Cancelar chamado</button>`:''}${!admin&&['CONCLUÍDO','REJEITADO'].includes(t.status)?`<button class="btn" onclick="feedback('${t.id}')">Avaliar atendimento</button>`:''}</div></details>`}
async function myTickets(){const d=await call('myTickets');$('main').innerHTML=head('Meus chamados','Acompanhe solicitações e movimentações')+`<div class="stack">${d.items.length?d.items.map(t=>ticketCard(t)).join(''):empty('Você ainda não possui chamados.')}</div>`}
async function cancelTicket(id){if(!confirm('Deseja cancelar este chamado?'))return;await call('cancelTicket',{id});toast('Chamado cancelado');myTickets()}
function feedback(id){modal('Avaliar atendimento',`<div class="field"><label>Nota de 1 a 5</label><select id="fbStars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="field"><label>Comentário</label><textarea id="fbComment"></textarea></div><button class="btn primary" onclick="sendFeedback('${id}')">Enviar avaliação</button>`)}
async function sendFeedback(id){await call('feedback',{id,stars:$('fbStars').value,comment:$('fbComment').value});closeModal();toast('Avaliação enviada')}
async function adminTickets(){const d=await call('adminTickets');$('main').innerHTML=head('Gestão de chamados','Acompanhamento de solicitações e SLA')+`<div class="stack">${d.items.length?d.items.map(t=>ticketCard(t,true)).join(''):empty('Nenhum chamado encontrado.')}</div>`}
async function adminTicketAction(id,status){const note=prompt('Observação (opcional):')||'';await call('updateTicket',{id,status,note});toast('Chamado atualizado');adminTickets()}
function extendTicket(id){modal('Prorrogar prazo',`<div class="field"><label>Dias úteis adicionais</label><input id="extraDays" type="number" min="1" value="1"></div><div class="field"><label>Justificativa</label><textarea id="extraNote" required></textarea></div><button class="btn primary" onclick="saveExtension('${id}')">Confirmar extensão</button>`)}
async function saveExtension(id){await call('extendTicket',{id,days:Number($('extraDays').value),note:$('extraNote').value});closeModal();toast('Prazo prorrogado');adminTickets()}
async function internalTickets(){const d=await call('internalTickets');$('main').innerHTML=head('Tickets','Visão operacional dos chamados')+`<div class="stack">${d.items.length?d.items.map(t=>ticketCard(t,true)).join(''):empty('Nenhum ticket.')}</div>`}
async function adminAnnouncements(){const d=await call('listAnnouncements');CACHE.announcements=d.items;$('main').innerHTML=head('Comunicados','Publicação e acompanhamento',`<button class="btn primary" onclick="announcementModal()">Novo comunicado</button>`)+`<div class="stack">${d.items.map(a=>`<div class="card"><div class="between"><h3>${esc(a.title)}</h3><span class="pill">${a.readCount||0} leituras</span></div><p>${esc(a.body)}</p><div class="actions"><button class="btn" onclick="readers('${a.id}')">Ver quem leu</button><button class="btn" onclick="announcementModal('${a.id}')">Editar</button><button class="btn danger" onclick="deleteAnnouncement('${a.id}')">Excluir</button></div></div>`).join('')}</div>`}
function announcementModal(id=''){const a=(CACHE.announcements||[]).find(x=>x.id===id)||{};modal(id?'Editar comunicado':'Novo comunicado',`${formField('Título','aTitle','text',a.title||'')}${formField('Texto','aBody','textarea',a.body||'')}<label><input id="aMandatory" type="checkbox" ${a.mandatory===false?'':'checked'}> Leitura obrigatória</label><div class="field"><label>Data de publicação</label><input id="aDate" type="date" value="${a.dateISO||new Date().toISOString().slice(0,10)}"></div><button class="btn primary" onclick="saveAnnouncement('${id}')">Salvar comunicado</button>`)}
async function saveAnnouncement(id){await call('saveAnnouncement',{id,title:$('aTitle').value,body:$('aBody').value,mandatory:$('aMandatory').checked,date:$('aDate').value});closeModal();toast('Comunicado salvo');adminAnnouncements()}
async function deleteAnnouncement(id){if(!confirm('Excluir comunicado?'))return;await call('deleteAnnouncement',{id});adminAnnouncements()}
async function readers(id){const d=await call('announcementReaders',{id});modal('Confirmações de leitura',`<p>${d.items.length} confirmação(ões)</p>${d.items.map(x=>`<p>${esc(x.name)} · ${esc(x.email)} · ${esc(x.shift)} · ${esc(x.readAt)}</p>`).join('')||'Nenhuma leitura registrada.'}`)}
async function library(){const d=await call('listLibrary');$('main').innerHTML=head('Biblioteca RH','Documentos oficiais disponibilizados pelo RH')+`<div class="stack">${d.items.length?d.items.map(f=>`<div class="card between"><div><b>${esc(f.title)}</b><div class="small muted">${esc(f.description||'Documento PDF')}</div></div><div class="actions"><button class="btn primary" onclick="viewPdf('${f.id}')">Visualizar</button><button class="btn" onclick="downloadPdf('${f.id}')">Baixar</button></div></div>`).join(''):empty('Nenhum documento disponível.')}</div>`}
async function viewPdf(id){const r=await call('getLibraryFile',{id});modal('Visualização do documento',`<div class="pdfbox" id="pdfCanvasBox"></div><p class="small muted">Documento disponibilizado pelo FALA RH.</p>`);renderPdf(r.base64)}
async function renderPdf(b64){if(!window.pdfjsLib){$('pdfCanvasBox').textContent='Visualizador PDF indisponível. Use Baixar.';return}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const raw=atob(b64),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);const pdf=await pdfjsLib.getDocument({data:arr}).promise;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),vp=page.getViewport({scale:1.2}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=vp.width;canvas.height=vp.height;canvas.style.width='100%';$('pdfCanvasBox').appendChild(canvas);await page.render({canvasContext:ctx,viewport:vp}).promise}}
async function downloadPdf(id){const r=await call('getLibraryFile',{id});const a=document.createElement('a');a.href='data:application/pdf;base64,'+r.base64;a.download=r.name||'documento.pdf';a.click()}
async function adminLibrary(){const d=await call('listLibrary');$('main').innerHTML=head('Biblioteca RH','Gerencie os PDFs publicados',`<button class="btn primary" onclick="uploadPdfModal()">Publicar PDF</button>`)+`<div class="stack">${d.items.map(f=>`<div class="card between"><div><b>${esc(f.title)}</b><div class="small muted">${esc(f.name)}</div></div><button class="btn danger" onclick="removePdf('${f.id}')">Excluir</button></div>`).join('')}</div>`}
function uploadPdfModal(){modal('Publicar PDF',`${formField('Título','pdfTitle')}${formField('Descrição','pdfDesc')}<div class="field"><label>Arquivo PDF</label><input type="file" id="pdfFile" accept="application/pdf"></div><button class="btn primary" onclick="uploadPdf()">Enviar PDF</button>`)}
async function uploadPdf(){const f=$('pdfFile').files[0];if(!f||f.type!=='application/pdf')return toast('Selecione um PDF válido');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});await call('uploadLibrary',{title:$('pdfTitle').value,description:$('pdfDesc').value,name:f.name,mimeType:f.type,base64:b64});closeModal();toast('PDF publicado');adminLibrary()}
async function removePdf(id){if(!confirm('Excluir este documento?'))return;await call('deleteLibrary',{id});adminLibrary()}
async function faq(){const d=await call('listFaq');CACHE.faq=d.items;$('main').innerHTML=head('FAQ','Perguntas frequentes')+`<div class="stack">${d.items.map(x=>`<details class="ticket"><summary>${esc(x.question)}</summary><div class="ticket-body">${esc(x.answer)}</div></details>`).join('')||empty('Nenhuma pergunta cadastrada.')}</div>`}
async function adminFaq(){const d=await call('listFaq');CACHE.faq=d.items;$('main').innerHTML=head('FAQ','Gerencie perguntas e respostas',`<button class="btn primary" onclick="faqModal()">Nova pergunta</button>`)+`<div class="stack">${d.items.map(x=>`<div class="card"><b>${esc(x.question)}</b><p>${esc(x.answer)}</p><button class="btn" onclick="faqModal('${x.id}')">Editar</button> <button class="btn danger" onclick="deleteFaq('${x.id}')">Excluir</button></div>`).join('')}</div>`}
function faqModal(id=''){const x=(CACHE.faq||[]).find(a=>a.id===id)||{};modal('Pergunta frequente',`${formField('Pergunta','fqQ','text',x.question||'')}${formField('Resposta','fqA','textarea',x.answer||'')}<button class="btn primary" onclick="saveFaq('${id}')">Salvar</button>`)}
async function saveFaq(id){await call('saveFaq',{id,question:$('fqQ').value,answer:$('fqA').value});closeModal();adminFaq()}
async function deleteFaq(id){if(!confirm('Excluir pergunta?'))return;await call('deleteFaq',{id});adminFaq()}
async function reports(){if(ADMIN.includes(PROFILE.role)){const d=await call('listReports');$('main').innerHTML=head('Reports','Manifestações confidenciais recebidas')+`<div class="stack">${d.items.length?d.items.map(r=>`<div class="card"><div class="between"><b>${esc(r.type)} · ${esc(r.subject)}</b><span class="pill orange">${esc(r.status)}</span></div><p>${esc(r.body)}</p><span class="small muted">${esc(r.createdAt)}</span></div>`).join(''):empty('Nenhuma manifestação recebida.')}</div>`;return}$('main').innerHTML=head('Reports','Canal confidencial de denúncias, reclamações e elogios')+`<div class="card"><form id="reportForm">${formField('Tipo','rType','text','',['DENÚNCIA','RECLAMAÇÃO','ELOGIO'])}${formField('Assunto','rSubject')}${formField('Relato','rBody','textarea')}<button class="btn primary">Enviar manifestação</button></form></div>`;$('reportForm').onsubmit=async e=>{e.preventDefault();await call('createReport',{type:$('rType').value,subject:$('rSubject').value,body:$('rBody').value});toast('Manifestação enviada');navigate('home')}}
async function analytics(){const d=await call('analytics');$('main').innerHTML=head('Relatórios','Indicadores operacionais e engajamento')+`<div class="field" style="max-width:220px"><label>Período inicial</label><input type="date" id="fromDate"></div><div class="field" style="max-width:220px"><label>Período final</label><input type="date" id="toDate"></div><button class="btn primary" onclick="refreshAnalytics()">Aplicar filtros</button><div style="height:15px"></div><div class="grid">${stat('Chamados',d.totalTickets)}${stat('No prazo',d.onTime)}${stat('SLA vencido',d.overdue)}${stat('Leituras',d.reads)}</div><div class="card" style="margin-top:15px"><h3>Engajamento por turno</h3><div class="table-wrap"><table><thead><tr><th>Turno</th><th>Logins</th><th>Interações</th><th>Chamados</th><th>Leituras</th></tr></thead><tbody>${d.shifts.map(s=>`<tr><td>${s.shift}</td><td>${s.logins}</td><td>${s.interactions}</td><td>${s.tickets}</td><td>${s.reads}</td></tr>`).join('')}</tbody></table></div></div><div class="grid" style="margin-top:15px">${d.panels.map(p=>`<div class="card"><b>${esc(p.title)}</b><div class="num">${esc(p.value)}</div><div class="small muted">${esc(p.detail||'')}</div></div>`).join('')}</div><button class="btn" style="margin-top:15px" onclick="exportAnalytics()">Exportar CSV</button>`}
async function refreshAnalytics(){const d=await call('analytics',{from:$('fromDate').value,to:$('toDate').value});toast('Filtros aplicados');$('main').querySelector('.card').scrollIntoView({behavior:'smooth'})}
async function exportAnalytics(){const d=await call('exportAnalytics');const blob=new Blob([d.csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio_fala_rh.csv';a.click();URL.revokeObjectURL(a.href)}
async function users(){const d=await call('listUsers');$('main').innerHTML=head('Colaboradores','Consulta e gestão de perfis')+`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Turno</th><th>Status</th><th>Ação</th></tr></thead><tbody>${d.items.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${esc(u.shift)}</td><td>${esc(u.status)}</td><td><button class="btn" onclick="editUser('${u.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
async function editUser(id){const d=await call('getUser',{id}),u=d.user;modal('Editar colaborador',`${formField('Nome','uName','text',u.name)}${formField('E-mail','uEmail','email',u.email)}${formField('WhatsApp','uPhone','text',u.phone)}${formField('Turno','uShift','text',u.shift,['T1','T2','T3','T4'])}<button class="btn primary" onclick="saveUser('${id}')">Salvar alterações</button>`)}
async function saveUser(id){await call('updateUser',{id,name:$('uName').value,email:$('uEmail').value,phone:$('uPhone').value,shift:$('uShift').value});closeModal();users()}
async function profile(){modal('Meu perfil',`${formField('Nome','pName','text',PROFILE.name)}${formField('E-mail pessoal','pEmail','email',PROFILE.email)}${formField('WhatsApp','pPhone','text',PROFILE.phone||'')}${formField('Turno','pShift','text',PROFILE.shift,['T1','T2','T3','T4'])}<button class="btn primary" onclick="saveProfile()">Salvar perfil</button>`)}
async function saveProfile(){const d=await call('updateProfile',{name:$('pName').value,email:$('pEmail').value,phone:$('pPhone').value,shift:$('pShift').value});PROFILE=d.profile;$('userLabel').textContent=PROFILE.name+' · '+PROFILE.role;closeModal();toast('Perfil atualizado');navigate(CURRENT)}
async function admins(){const d=await call('listAdmins');$('main').innerHTML=head('Gerenciar acessos','Apenas administradores principais podem alterar a hierarquia',`<button class="btn primary" onclick="adminModal()">Cadastrar administrador</button>`)+`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Reports</th></tr></thead><tbody>${d.items.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td>${esc(a.role)}</td><td>${esc(a.status)}</td><td>${a.reportsAccess?'Autorizado':'Não autorizado'}</td></tr>`).join('')}</tbody></table></div>`}
function adminModal(){modal('Novo administrador',`${formField('Nome','adName')}${formField('E-mail','adEmail','email')}${formField('Perfil','adRole','text','',['ASSISTENTE','PRINCIPAL'])}<label><input type="checkbox" id="adReports"> Autorizar acesso a Reports</label><button class="btn primary" onclick="createAdmin()">Cadastrar</button>`)}
async function createAdmin(){await call('createAdmin',{name:$('adName').value,email:$('adEmail').value,role:$('adRole').value,reportsAccess:$('adReports').checked});closeModal();admins()}
async function audit(){const d=await call('audit');$('main').innerHTML=head('Auditoria','Registro de ações do sistema')+`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`).join('')}</tbody></table></div>`}
async function passwordModal(force=false){modal(force?'Crie uma nova senha':'Alterar senha',`<p class="muted">Use uma senha com pelo menos 8 caracteres.</p><div class="field"><label>Senha atual</label><input id="oldPass" type="password"></div><div class="field"><label>Nova senha</label><input id="newPass" type="password" minlength="8"></div><div class="field"><label>Confirmar nova senha</label><input id="newPass2" type="password" minlength="8"></div><button class="btn primary" onclick="changePassword(${force})">Salvar senha</button>`)}
async function changePassword(force){if($('newPass').value!==$('newPass2').value)return toast('As senhas não conferem');await call('changePassword',{oldPassword:$('oldPass').value,newPassword:$('newPass').value});PROFILE.mustChangePassword=false;closeModal();toast('Senha alterada')}
const pages={home,adminHome,announcements,newTicket,myTickets,adminTickets,internalTickets,adminAnnouncements,library,adminLibrary,faq,adminFaq,reports,analytics,users,admins,audit};
async function init(){const token=localStorage.getItem('falaSession');if(!token)return showAuth();SESSION=token;try{const r=await api('resumeSession',{});PROFILE=r.profile;showApp()}catch(e){localStorage.removeItem('falaSession');SESSION=null;showAuth()}}
init();
</script>
